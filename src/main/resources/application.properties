spring.application.name=notes-api
server.port=8080

# Database: H2 by default; set DB_URL/DB_USER/DB_PASSWORD to use RDS PostgreSQL
spring.datasource.url=${DB_URL:jdbc:h2:mem:notesdb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Create/update tables automatically (fine for learning; use Flyway in real projects)
spring.jpa.hibernate.ddl-auto=update

# Health endpoint for load balancers: /actuator/health
management.endpoints.web.exposure.include=health,info
